[build]
command = "npm run build"
publish = "dist"

# The site's own claim about where it lives. Baseline reads settings.url and
# nothing else, so this is the only place production supplies it. Netlify's
# own URL is deliberately unused: one name, stated here.
[context.production.environment]
  BASELINE_URL = "https://www.eleventy-baseline.dev/"

[context.branch-deploy]
  command = "BASELINE_URL=$DEPLOY_PRIME_URL npm run build"

# Docs restructure, 2026-08-19. Content helpers moved from the concept chapter
# to core reference: it is authoring-syntax lookup, not a "why" page. The slug
# is unchanged, so every wikilink still resolves; only the chapter prefix moved.
[[redirects]]
  from = "/docs/concept/content-helpers/"
  to = "/docs/core-reference/content-helpers/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy    = "upgrade-insecure-requests"
    Strict-Transport-Security  = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options     = "nosniff"
    X-Frame-Options            = "DENY"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), publickey-credentials-get=()"
    Link                       = '''</sitemap.xml>; rel="sitemap", </llms.txt>; rel="alternate"; type="text/plain", </.well-known/api-catalog>; rel="api-catalog", </schemamap.xml>; rel="schemamap"'''

[[headers]]
  for = "/.well-known/api-catalog"
  [headers.values]
    Content-Type   = "application/linkset+json"
    Cache-Control  = "public, max-age=300"
